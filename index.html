<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>twquant Dashboard</title>
<style>
  html, body { margin:0; padding:0; background:#0a0e14; color:#c9d1d9;
               font-family:-apple-system,'Segoe UI',sans-serif; }
  .center { position:fixed; inset:0; display:flex; align-items:center;
            justify-content:center; flex-direction:column; gap:1rem; }
  .spinner { width:32px; height:32px; border:3px solid #232b3a;
             border-top-color:#58a6ff; border-radius:50%;
             animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size:14px; color:#7d8590; }
  .err { color:#f85149; margin-top:1rem; font-size:13px; }
  a { color:#58a6ff; }
</style>
</head>
<body>
<div class="center">
  <div class="spinner"></div>
  <div class="msg">載入最新 dashboard...</div>
  <div class="err" id="err"></div>
</div>
<script>
  // 強制每次抓新版（timestamp 突破所有 cache 層）
  (async () => {
    const t = Date.now();
    try {
      const r = await fetch('latest.json?_=' + t, { cache: 'no-store' });
      if (!r.ok) throw new Error('latest.json HTTP ' + r.status);
      const data = await r.json();
      const url = 'd_' + data.latest + '.html?_=' + t;
      location.replace(url);
    } catch (e) {
      document.getElementById('err').innerHTML =
        '載入失敗：' + e.message +
        '<br><a href="d_LATEST.html">點此手動載入</a>';
    }
  })();
</script>
</body>
</html>
